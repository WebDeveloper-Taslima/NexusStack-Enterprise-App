<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NexusStack Enterprise — Full-Stack JavaScript Application featuring Node.js Express backend, SQLite/PostgreSQL CRUD Database, Claude AI Streaming SDK integration, and modern Vite UI." />
  <title>NexusStack Enterprise — Master Full-Stack JS & Claude AI Suite</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- RemixIcon CDN -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="bg-dark text-light font-sans">
  <div id="app" class="app-layout">
    
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-container">
        <div class="brand-logo">
          <div class="logo-badge">
            <i class="ri-sparkling-fill logo-icon"></i>
          </div>
          <div class="brand-text">
            <span class="brand-title">Nexus<span class="gradient-text">Stack Enterprise</span></span>
            <span class="brand-subtitle">Node.js Express • Claude AI SDK • SQL & pgvector</span>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
          <button class="nav-tab active" data-tab="ai-studio">
            <i class="ri-robot-2-line"></i>
            <span>Claude AI Studio</span>
          </button>
          <button class="nav-tab" data-tab="data-hub">
            <i class="ri-database-2-line"></i>
            <span>Data Hub & CRUD</span>
          </button>
          <button class="nav-tab" data-tab="db-explorer">
            <i class="ri-cpu-line"></i>
            <span>Database Explorer</span>
          </button>
          <button class="nav-tab" data-tab="api-tester">
            <i class="ri-code-s-slash-line"></i>
            <span>API Tester</span>
          </button>
          <button class="nav-tab" data-tab="db-guide">
            <i class="ri-compass-3-line"></i>
            <span>SQL vs NoSQL Guide</span>
          </button>
        </nav>

        <!-- System Health Status -->
        <div class="header-actions">
          <div id="health-badge" class="status-indicator loading">
            <span class="status-dot"></span>
            <span class="status-text">Connecting API...</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <section id="tab-ai-studio" class="tab-pane active"></section>
      <section id="tab-data-hub" class="tab-pane"></section>
      <section id="tab-db-explorer" class="tab-pane"></section>
      <section id="tab-api-tester" class="tab-pane"></section>
      <section id="tab-db-guide" class="tab-pane"></section>
    </main>

    <!-- Global Footer -->
    <footer class="app-footer">
      <div class="footer-content">
        <p>Built with ⚡ Node.js Express, Vite, SQLite/PostgreSQL & Anthropic Claude 3.5 Sonnet SDK</p>
        <div class="footer-links">
          <span class="badge badge-accent">Full-Stack Enterprise Stack</span>
          <span class="badge badge-outline">SSE Token Streaming</span>
        </div>
      </div>
    </footer>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
